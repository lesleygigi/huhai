name: Deploy CloudBase Hosting

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: cloudbase-hosting-master
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VITE_CLOUDBASE_ENV_ID: ${{ secrets.TCB_ENV_ID }}
      VITE_APP_ENV: production
      COS_SDK_KEEPALIVE: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Install CloudBase CLI
        run: npm install -g @cloudbase/cli

      - name: Login CloudBase CLI
        run: tcb login --apiKeyId "${{ secrets.TCB_SECRET_ID }}" --apiKey "${{ secrets.TCB_SECRET_KEY }}"

      - name: Deploy static hosting
        run: |
          for attempt in 1 2 3; do
            echo "CloudBase deploy attempt ${attempt}/3"
            if tcb hosting deploy ./dist -e "${{ secrets.TCB_ENV_ID }}"; then
              exit 0
            fi

            if [ "${attempt}" -lt 3 ]; then
              sleep_seconds=$((attempt * 20))
              echo "CloudBase deploy failed, retrying in ${sleep_seconds}s..."
              sleep "${sleep_seconds}"
            fi
          done

          echo "CloudBase deploy failed after 3 attempts."
          exit 1
